<script>
/* celular (sem mouse): o 1º toque seleciona a porta (acende e mostra o nome) e o 2º toque abre; tocar fora desfaz a seleção */
(function(){
  if(!window.matchMedia||!matchMedia('(hover: none)').matches)return;
  var hs=[].slice.call(document.querySelectorAll('.hot'));
  hs.forEach(function(a){a.addEventListener('click',function(e){
    if(!a.classList.contains('ativa')){e.preventDefault();hs.forEach(function(x){x.classList.remove('ativa')});a.classList.add('ativa');}
  });});
  document.addEventListener('click',function(e){if(!(e.target.closest&&e.target.closest('.hot')))hs.forEach(function(x){x.classList.remove('ativa')});});
})();
</script>
